name: dhap34-mfonekpo-email

x-airflow-common: &airflow-common
  image: dhap34-mfonekpo-email-airflow:2.11.2
  build: .
  user: "50000:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run scripts/init_env.py first}
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Run scripts/init_env.py first}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS: "false"
    METADATA_DB_HOST: ${METADATA_DB_HOST:?Set METADATA_DB_HOST in .env}
    METADATA_DB_PORT: ${METADATA_DB_PORT:?Set METADATA_DB_PORT in .env}
    METADATA_DB_NAME: ${METADATA_DB_NAME:?Set METADATA_DB_NAME in .env}
    METADATA_DB_USER: ${METADATA_DB_USER:?Set METADATA_DB_USER in .env}
    METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD:?Run scripts/init_env.py first}
    WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST:?Set WAREHOUSE_DB_HOST in .env}
    WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:?Set WAREHOUSE_DB_PORT in .env}
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env}
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:?Set WAREHOUSE_DB_USER in .env}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?Run scripts/init_env.py first}
    PIPELINE_PROJECT_DIR: /opt/airflow/project
    PIPELINE_WORK_DIR: /opt/airflow/work
    PYTHONPATH: /opt/airflow/dags:/opt/airflow/project
    PYTHONDONTWRITEBYTECODE: "1"
  volumes: &airflow-volumes
    - ./dags:/opt/airflow/dags:ro
    - ./scripts:/opt/airflow/project/scripts:ro
    - ./data:/opt/airflow/project/data:ro
    - ./manifest.yaml:/opt/airflow/project/manifest.yaml:ro
    - ./schema.yaml:/opt/airflow/project/schema.yaml:ro
    - ./ddl.sql:/opt/airflow/project/ddl.sql:ro
    - airflow-logs:/opt/airflow/logs
    - pipeline-work:/opt/airflow/work
  depends_on: &airflow-databases
    postgres-metadata:
      condition: service_healthy
    postgres-target:
      condition: service_healthy

services:
  postgres-metadata:
    image: postgres:16
    environment:
      POSTGRES_DB: ${METADATA_DB_NAME:?Set METADATA_DB_NAME in .env}
      POSTGRES_USER: ${METADATA_DB_USER:?Set METADATA_DB_USER in .env}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?Run scripts/init_env.py first}
    volumes:
      - postgres-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres-target:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:?Set WAREHOUSE_DB_USER in .env}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?Run scripts/init_env.py first}
    volumes:
      - postgres-target:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${WAREHOUSE_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["airflow", "version"]
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Run scripts/init_env.py first}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:?Set AIRFLOW_ADMIN_EMAIL in .env}
      _AIRFLOW_WWW_USER_FIRSTNAME: Local
      _AIRFLOW_WWW_USER_LASTNAME: Administrator
      _AIRFLOW_WWW_USER_ROLE: Admin
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: ["airflow", "webserver"]
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8080}:8080"
    depends_on:
      <<: *airflow-databases
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on:
      <<: *airflow-databases
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  airflow-cli:
    <<: *airflow-common
    profiles: ["tools"]
    command: ["airflow", "version"]
    depends_on:
      <<: *airflow-databases
      airflow-init:
        condition: service_completed_successfully
    restart: "no"

  tests:
    <<: *airflow-common
    profiles: ["tests"]
    # Unit tests run without starting databases or invoking Airflow's entrypoint.
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "/opt/airflow/project/tests", "-v"]
    command: []
    depends_on: {}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./tests:/opt/airflow/project/tests:ro
      - ./scripts:/opt/airflow/project/scripts:ro
      - ./manifest.yaml:/opt/airflow/project/manifest.yaml:ro
      - ./schema.yaml:/opt/airflow/project/schema.yaml:ro
      - ./ddl.sql:/opt/airflow/project/ddl.sql:ro
    restart: "no"

volumes:
  postgres-metadata:
  postgres-target:
  airflow-logs:
  pipeline-work:
